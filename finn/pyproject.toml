[project]
name = "finn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
